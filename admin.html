<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#d33f30">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PastaPresto! Manager</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="admin.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PastaPresto">
<script>
/* Attach the brand stylesheet before first paint, so a branded screen never
   flashes the default palette. The id is sanitised because it comes from the
   query string. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get('brand');
    if (q) localStorage.setItem('pp.brand', q);
    var id = (q || localStorage.getItem('pp.brand') || 'default').replace(/[^a-z0-9-]/gi, '');
    if (id && id !== 'default') {
      document.documentElement.setAttribute('data-brand', id);
      document.write('<link rel="stylesheet" href="brands/' + id + '.css">');
    }
  } catch (e) { /* private mode: stay unbranded */ }
})();
</script>
</head>
<body>

<header class="appbar no-print">
  <div class="wrap appbar-inner">
    <div class="brand" id="masthead"></div>
    <span class="pill">Manager</span>
    <div class="grow"></div>
    <nav class="staffnav" aria-label="Staff screens">
        <a class="staffpill" href="kitchen.html">Kitchen</a>
        <a class="staffpill" href="expo.html">Expo</a>
        <a class="staffpill" href="admin.html" aria-current="page">Manager</a>
        <a class="staffpill" href="report.html">Close-out</a>
      </nav>
  </div>
</header>

<main class="wrap admin">

  <section class="no-print">
    <h2 class="sec-title">Today at a glance</h2>
    <div class="statgrid" id="statgrid"></div>
    <div class="card" style="margin-top:14px">
      <div class="row-between">
        <div>
          <strong>Demo controls</strong>
          <p class="muted" style="margin:4px 0 0;font-size:14px">Seed a believable rail of chits, or clear today and start clean.</p>
        </div>
        <div class="row">
          <button class="btn btn-ghost" id="seedBtn" type="button">Seed demo orders</button>
          <button class="btn btn-ghost" id="resetBtn" type="button">Clear today</button>
        </div>
      </div>
    </div>
  </section>

  <section class="no-print">
    <h2 class="sec-title">QR codes</h2>
    <div class="card stack">
      <div class="field">
        <label for="baseUrl">Base address printed into every QR code</label>
        <input class="input" id="baseUrl" type="text" spellcheck="false">
        <p class="muted" style="margin:0;font-size:14px" id="baseHint"></p>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn btn-primary" id="regenBtn" type="button">Rebuild codes</button>
        <button class="btn btn-ghost" id="printBtn" type="button">Print table tents</button>
        <span class="muted" id="qrMeta"></span>
      </div>
    </div>
    <div class="qrgrid" id="qrgrid"></div>
  </section>

  <section class="tents" id="tents"></section>

  <section class="no-print">
    <h2 class="sec-title">Menu, cook times &amp; 86 list</h2>
    <div class="notice" id="summary86" style="margin-bottom:14px">Loading&hellip;</div>
    <div class="card" id="menuRef"></div>
  </section>

  <!-- The quiet corner: things you set once and then forget about. Kept at the
       bottom, low contrast, out of the way of a live service. -->
  <footer class="quiet no-print">
    <div class="quiet-row">
      <div>
        <h3 class="quiet-title">Branding</h3>
        <p class="quiet-note" id="brandNote"></p>
      </div>
      <div class="brandswitch" id="brandSwitch" role="group" aria-label="Venue branding"></div>
    </div>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app/admin.js"></script>
<script type="module" src="app/pwa.js"></script>
</body>
</html>
