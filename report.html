<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#d33f30">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PastaPresto! Close-Out Report</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="report.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* Attach the brand stylesheet before first paint, so a branded screen never
   flashes the default palette. The id is sanitised because it comes from the
   query string. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get('brand');
    if (q) localStorage.setItem('pp.brand', q);
    var id = (q || localStorage.getItem('pp.brand') || 'default').replace(/[^a-z0-9-]/gi, '');
    if (id && id !== 'default') {
      document.documentElement.setAttribute('data-brand', id);
      document.write('<link rel="stylesheet" href="brands/' + id + '.css">');
    }
  } catch (e) { /* private mode: stay unbranded */ }
})();
</script>
</head>
<body>

<header class="appbar no-print">
  <div class="wrap appbar-inner">
    <div class="brand" id="masthead"></div>
    <div class="grow"></div>
    <nav class="staffnav" aria-label="Staff screens">
        <a class="staffpill" href="kitchen.html">Kitchen</a>
        <a class="staffpill" href="expo.html">Expo</a>
        <a class="staffpill" href="admin.html">Manager</a>
        <a class="staffpill" href="report.html" aria-current="page">Close-out</a>
      </nav>
  </div>
</header>

<main class="wrap report">

  <section class="no-print">
    <div class="card rpt-controls">
      <div class="field">
        <label for="datePick">Service date</label>
        <input class="input" id="datePick" type="date">
      </div>
      <div class="row" style="flex-wrap:wrap;gap:8px">
        <button class="btn btn-ghost" id="tonightBtn" type="button">Tonight</button>
        <button class="btn btn-ghost" id="yesterdayBtn" type="button">Yesterday</button>
        <div class="grow"></div>
        <button class="btn btn-ghost" id="csvBtn" type="button">Download CSV</button>
        <button class="btn btn-ghost" id="printBtn" type="button">Print</button>
        <button class="btn btn-primary" id="pdfBtn" type="button">Save PDF</button>
      </div>
    </div>
  </section>

  <div id="reportBody"></div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app/report.js"></script>
<script type="module" src="app/pwa.js"></script>
</body>
</html>
