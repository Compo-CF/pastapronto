<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#d33f30">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PastaPresto! Expo &amp; Runner Board</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="/kitchen.css">
<link rel="stylesheet" href="expo.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PastaPresto">
</head>
<body class="kds expo">

<header class="kbar">
  <div class="kbrand"><span id="brandMark"></span> Pasta<em>Presto!</em> <span class="kbrand-sub">Expo &amp; Runners</span></div>

  <nav class="staffnav" aria-label="Staff screens">
    <a class="staffpill" href="kitchen.html">Kitchen</a>
    <a class="staffpill" href="expo.html" aria-current="page">Expo</a>
    <a class="staffpill" href="admin.html">Manager</a>
    <a class="staffpill" href="report.html">Close-out</a>
  </nav>
  <div class="grow"></div>
  <button class="kbtn" id="soundToggle" type="button" aria-pressed="false"><span id="soundIcon">&#128263;</span> Sound</button>
  <div class="kclock tabnum" id="clock">--:--</div>
  <span class="conn" id="conn">connecting</span>
</header>

<main class="expo-main">
  <section class="expo-ready">
    <h2 class="lane-head"><span>Run These Now</span><span class="lane-count" id="readyCount">0</span></h2>
    <div class="expo-grid" id="readyGrid"></div>
  </section>

  <aside class="expo-next">
    <h2 class="lane-head"><span>Coming Up</span><span class="lane-count" id="nextCount">0</span></h2>
    <div class="expo-next-body" id="nextList"></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app/expo.js"></script>
<script type="module" src="app/pwa.js"></script>
</body>
</html>
