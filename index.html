<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d33f30">
<title>PastaPresto! - Order</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="guest.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PastaPresto">
<script>
/* Attach the brand stylesheet before first paint, so a branded screen never
   flashes the default palette. The id is sanitised because it comes from the
   query string. */
(function () {
  try {
    var q = new URLSearchParams(location.search).get('brand');
    if (q) localStorage.setItem('pp.brand', q);
    var id = (q || localStorage.getItem('pp.brand') || 'default').replace(/[^a-z0-9-]/gi, '');
    if (id && id !== 'default') {
      document.documentElement.setAttribute('data-brand', id);
      document.write('<link rel="stylesheet" href="brands/' + id + '.css">');
    }
  } catch (e) { /* private mode: stay unbranded */ }
})();
</script>
</head>
<body>

<header class="appbar">
  <div class="wrap appbar-inner">
    <div class="brand" id="masthead"></div>
    <div class="grow"></div>
    <div class="crumbs" id="crumbs" aria-hidden="true"></div>
    <button class="modeswitch" id="modeSwitch" type="button" aria-pressed="false">
      <span aria-hidden="true">&#9881;</span><span id="modeLabel">Simple</span>
    </button>
  </div>
</header>

<main id="stage" class="wrap" tabindex="-1">
  <div class="step-head">
    <p class="step-title">Warming the pot&hellip;</p>
  </div>
</main>

<div class="footbar" id="footbar" hidden>
  <div class="wrap footbar-inner" id="footbarInner"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app/guest.js"></script>
<script type="module" src="app/pwa.js"></script>
</body>
</html>
